[project]
name = "agent-chassis"
version = "0.1.0"
description = "A sketch of a chassis for human-in-the-loop agents (design experiment)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cool", email = "cool@phper.org" }]
dependencies = [
  "pydantic>=2.0",
  "langgraph>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_chassis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
